        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPasarela'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pasarela/v1/settlements/{fecha}:
    get:
      tags:
      - Pasarela simulada
      summary: Liquidacion
      description: Archivo de liquidación diario (insumo del nivel 1 de conciliación).
      operationId: liquidacion_pasarela_v1_settlements__fecha__get
      parameters:
      - name: fecha
        in: path
        required: true
        schema:
          type: string
          format: date
          title: Fecha
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
