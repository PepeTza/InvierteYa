openapi: 3.1.0
info:
  title: InvierteYa API (MVP · Sesión 3)
  description: 'Inversión fraccionada desde $5 a través de un **catálogo de 5 fideicomisos**
    administrados por un banco, con perfil de riesgo explicable (cuestionario en 2
    tandas), aporte repartido, IA predictiva (abandono y flujos) y protección de datos
    (AES-256-GCM, habeas data, k ≥ 10).


    **Todo lo externo está SIMULADO:** pasarela, adquirente, suiche, emisor, banco
    fiduciario, casa de bolsa, CVV y KMS. Solo datos sintéticos.'
  version: 0.3.0
paths:
  /v1/usuarios:
    post:
      tags:
      - Usuarios
      summary: Registrar
      description: Registro (datos sintéticos). El email se guarda cifrado con AES-256-GCM.
      operationId: registrar_v1_usuarios_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/usuarios/{usuario_id}/kyc:
    post:
      tags:
      - Usuarios
      summary: Kyc
      description: 'Proveedor de KYC SIMULADO (siempre aprueba) y aporta la edad,
        que ya no se pregunta en el

        cuestionario. La edad se guarda cifrada (AES-256-GCM). El resultado se comparte
        con el fiduciario.'
      operationId: kyc_v1_usuarios__usuario_id__kyc_post
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/KycIn'
              - type: 'null'
              title: Datos
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/usuarios/{usuario_id}/adhesion:
    post:
      tags:
      - Usuarios
      summary: Adhesion
      description: 'Firma electrónica del contrato de adhesión **a un fideicomiso
        del catálogo**: el usuario pasa a ser

        fideicomitente y beneficiario. Guarda sello de tiempo y hash SHA-256 del documento.

        Si el fideicomiso está *Por encima de tu perfil* exige `confirmacion_riesgo_extra:
        true`

        (si no, `422 CONFIRMACION_RIESGO_REQUERIDA`).'
      operationId: adhesion_v1_usuarios__usuario_id__adhesion_post
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdhesionIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
  /v1/fideicomisos:
    get:
      tags:
      - Fideicomisos
      summary: Fideicomisos
      description: 'Catálogo del banco (caché diaria) con la etiqueta de idoneidad
        para el perfil del usuario:

        `RECOMENDADO` → `COMPATIBLE` → `POR_ENCIMA_DEL_PERFIL`.'
      operationId: fideicomisos_v1_fideicomisos_get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario Id
      - name: riesgo_max
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 5
            minimum: 1
          - type: 'null'
          description: Filtro por nivel de riesgo
          title: Riesgo Max
        description: Filtro por nivel de riesgo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/usuarios/{usuario_id}/perfil:
    post:
      tags:
      - Perfil y tutor
      summary: Perfil
      description: 'Tanda 1 del cuestionario conversacional (formato S3; la edad sale
        del KYC) o el formato de

        10 preguntas de la Sesión 2. Devuelve perfil, explicación simple, qué lo cambiaría
        y una lección.'
      operationId: perfil_v1_usuarios__usuario_id__perfil_post
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CuestionarioS3In'
              - $ref: '#/components/schemas/CuestionarioIn'
              title: C
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
  /v1/usuarios/{usuario_id}/perfil/tanda2:
    patch:
      tags:
      - Perfil y tutor
      summary: Perfil Tanda2
      description: '''Afinemos tu perfil'': hogar + quiz amistoso. Recalcula con la
        Tanda 1 guardada.'
      operationId: perfil_tanda2_v1_usuarios__usuario_id__perfil_tanda2_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tanda2In'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
  /v1/usuarios/{usuario_id}/perfil/revision:
    post:
      tags:
      - Perfil y tutor
      summary: Perfil Revision
      description: 'Botón ''No estoy de acuerdo con mi perfil'': el caso pasa a revisión
        de un asesor humano.'
      operationId: perfil_revision_v1_usuarios__usuario_id__perfil_revision_post
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
  /v1/lecciones:
    get:
      tags:
      - Perfil y tutor
      summary: Leccion
      description: 'Tutor con contenido predefinido: selecciona la lección según paso,
        perfil y nivel.'
      operationId: leccion_v1_lecciones_get
      security:
      - HTTPBearer: []
      parameters:
      - name: paso
        in: query
        required: true
        schema:
          enum:
          - CUESTIONARIO_COMPLETO
          - ANTES_PRIMER_APORTE
          - UNIDADES_ASIGNADAS
          - VER_PORTAFOLIO
          - ANTES_RESCATE
          type: string
          title: Paso
      - name: perfil
        in: query
        required: false
        schema:
          enum:
          - CONSERVADOR
          - MODERADO
          - AGRESIVO
          type: string
          default: CONSERVADOR
          title: Perfil
      - name: conocimiento
        in: query
        required: false
        schema:
          type: integer
          maximum: 5
          minimum: 1
          default: 1
          title: Conocimiento
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Leccion'
                - type: 'null'
                title: Response Leccion V1 Lecciones Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/aportes:
    post:
      tags:
      - Aportes
      summary: Crear Aporte
      description: 'Diagramas 1-3: autoriza, captura y asigna unidades **en cada fideicomiso
        de la distribución**;

        reversa ante timeout o falla. Comisión transparente: 1% de aporte + 2% de
        recargo solo con TARJETA

        (se cobra encima: se invierte el 100% del monto). Si se repite la misma Idempotency-Key,
        devuelve

        el resultado original (`duplicado: true`).'
      operationId: crear_aporte_v1_aportes_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: Evita cobros dobles si se reintenta
          title: Idempotency-Key
        description: Evita cobros dobles si se reintenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AporteIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AporteOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
  /v1/aportes/{aporte_id}:
    get:
      tags:
      - Aportes
      summary: Ver Aporte
      operationId: ver_aporte_v1_aportes__aporte_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: aporte_id
        in: path
        required: true
        schema:
          type: string
          title: Aporte Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AporteOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/usuarios/{usuario_id}/portafolio:
    get:
      tags:
      - Aportes
      summary: Portafolio
      description: Consolidado total y desglose por fideicomiso.
      operationId: portafolio_v1_usuarios__usuario_id__portafolio_get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortafolioOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/usuarios/{usuario_id}/riesgo-abandono:
    get:
      tags:
      - IA predictiva
      summary: Riesgo Abandono
      description: 'Probabilidad de que el usuario deje de ahorrar en 60 días. **Solo
        sugiere** un recordatorio:

        nunca mueve dinero, cambia el perfil ni cobra. Respeta el consentimiento `alertas_ahorro`.'
      operationId: riesgo_abandono_v1_usuarios__usuario_id__riesgo_abandono_get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      - name: simular_inactivo
        in: query
        required: false
        schema:
          type: boolean
          description: 'Solo demo: simula un usuario inactivo para mostrar el aviso
            suave'
          default: false
          title: Simular Inactivo
        description: 'Solo demo: simula un usuario inactivo para mostrar el aviso
          suave'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiesgoAbandonoOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fiduciario/pronostico-flujos:
    get:
      tags:
      - IA predictiva
      summary: Pronostico Flujos
      description: Pronóstico de flujos netos por fideicomiso (mañana y 7 días) para
        planificar los lotes.
      operationId: pronostico_flujos_v1_fiduciario_pronostico_flujos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronosticoOut'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - HTTPBearer: []
  /v1/usuarios/{usuario_id}/consentimiento:
    put:
      tags:
      - Privacidad
      summary: Consentimiento
      description: Otorga o retira, en cualquier momento, consentimientos separados
        de los términos.
      operationId: consentimiento_v1_usuarios__usuario_id__consentimiento_put
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentimientoIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimientoOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
  /v1/usuarios/{usuario_id}/datos-personales:
    get:
      tags:
      - Privacidad
      summary: Datos Personales
      description: 'Derecho de acceso (Constitución art. 28): qué datos guardamos,
        para qué, con quién y cómo se protegen.'
      operationId: datos_personales_v1_usuarios__usuario_id__datos_personales_get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatosPersonalesOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Privacidad
      summary: Suprimir Datos Personales
      description: 'Derecho de supresión: anonimiza los datos de uso; conserva solo
        el registro contable (LC/FT).'
      operationId: suprimir_datos_personales_v1_usuarios__usuario_id__datos_personales_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          title: Usuario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupresionOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fiduciario/informe-agregado:
    get:
      tags:
      - Privacidad
      summary: Informe Agregado
      description: 'Capa Oro: saldo por perfil y fideicomiso de quienes consintieron;
        las celdas con < 10 personas

        se suprimen. Nunca se comparten ni venden datos individuales.'
      operationId: informe_agregado_v1_fiduciario_informe_agregado_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeAgregadoOut'
      security:
      - HTTPBearer: []
  /v1/operaciones/cierre:
    post:
      tags:
      - Operaciones
      summary: Cierre
      description: 'Job T+1: liquidación de la pasarela, abono a cada fideicomiso,
        conciliación en 3 niveles por

        fideicomiso y propuesta de órdenes por lote (InvierteYa propone, el fiduciario
        aprueba).

        `inyectar_descuadre=true` simula que la pasarela omite una transacción (para
        la demo).'
      operationId: cierre_v1_operaciones_cierre_post
      security:
      - HTTPBearer: []
      parameters:
      - name: fecha
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha
      - name: inyectar_descuadre
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Inyectar Descuadre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/operaciones/kms/rotar:
    post:
      tags:
      - Operaciones
      summary: Rotar Llaves
      description: 'KMS SIMULADO: rota la llave maestra y re-envuelve las llaves de
        datos (los datos no se re-cifran).'
      operationId: rotar_llaves_v1_operaciones_kms_rotar_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotacionLlavesOut'
      security:
      - HTTPBearer: []
  /v1/operaciones/auditoria:
    get:
      tags:
      - Operaciones
      summary: Auditoria
      description: Bitácora inmutable (Res. SUDEBAN 001.21) y verificación de la cadena
        SHA-256.
      operationId: auditoria_v1_operaciones_auditoria_get
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario Id
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demo/forzar-escenario:
    post:
      tags:
      - Operaciones
      summary: Forzar
      description: 'Solo para la demo: fuerza el resultado de las próximas operaciones
        de la pasarela.'
      operationId: forzar_v1_demo_forzar_escenario_post
      security:
      - HTTPBearer: []
      parameters:
      - name: escenarios
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          description: APROBADA, 51, 05, 59, TIMEOUT, FALLA_CAPTURA, REVERSO_SIN_RESPUESTA
          title: Escenarios
        description: APROBADA, 51, 05, 59, TIMEOUT, FALLA_CAPTURA, REVERSO_SIN_RESPUESTA
      - name: reemplazar
        in: query
        required: false
        schema:
          type: boolean
          description: Vacía la cola antes de agregar los escenarios
          default: false
          title: Reemplazar
        description: Vacía la cola antes de agregar los escenarios
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demo/reiniciar:
    post:
      tags:
      - Operaciones
      summary: Reiniciar Demo
      description: 'Solo para la demo: borra usuarios, aportes, cierres y escenarios
        forzados (todo vive en memoria).'
      operationId: reiniciar_demo_v1_demo_reiniciar_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /fiduciario/v1/fideicomisos:
    get:
      tags:
      - Banco fiduciario simulado
      summary: Catalogo Banco
      description: Catálogo que publica el banco fiduciario (simulado). InvierteYa
        lo cachea una vez al día.
      operationId: catalogo_banco_fiduciario_v1_fideicomisos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoBancoOut'
  /pasarela/v1/tokens:
    post:
      tags:
      - Pasarela simulada
      summary: Tokenizar
      description: 'Formulario/SDK de la pasarela: recibe el PAN (solo de PRUEBA)
        o el teléfono de Pago Móvil

        (sintético) y devuelve un token.'
      operationId: tokenizar_pasarela_v1_tokens_post
      requestBody:
        content:
