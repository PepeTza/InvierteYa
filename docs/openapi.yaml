              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pasarela/v1/authorizations:
    post:
      tags:
      - Pasarela simulada
      summary: Autorizar
      description: ISO 8583 0100/0110 hacia adquirente, suiche y emisor.
      operationId: autorizar_pasarela_v1_authorizations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutorizacionIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPasarela'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pasarela/v1/captures:
    post:
      tags:
      - Pasarela simulada
      summary: Capturar
      description: ISO 8583 0220/0230.
      operationId: capturar_pasarela_v1_captures_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturaIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPasarela'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pasarela/v1/reversals:
    post:
      tags:
      - Pasarela simulada
      summary: Reversar
      description: ISO 8583 0400/0410 con campo 90; si no hay respuesta, aviso 0420
        y repeticiones 0421.
      operationId: reversar_pasarela_v1_reversals_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversoIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPasarela'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pasarela/v1/refunds:
    post:
      tags:
      - Pasarela simulada
      summary: Devolver
      description: Devolución de un cobro ya capturado (cobros huérfanos detectados
